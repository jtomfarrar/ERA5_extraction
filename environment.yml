# Minimal environment for the ERA5_extraction scripts.
# Create with:  mamba env create -f environment.yml
# Versions are lower bounds matching the environment the scripts were last run in (Python 3.9, Sept 2026).
name: ERA5_extraction
channels:
  - conda-forge
dependencies:
  - python=3.9
  - numpy>=1.26
  - pandas>=1.5
  - xarray>=2024.3
  - netcdf4>=1.6
  - matplotlib>=3.6
  - basemap>=1.3.6
  - basemap-data-hires
  - cdsapi>=0.7.6
  - tqdm>=4.66
  - ffmpeg
  - ipykernel
  - ipympl
